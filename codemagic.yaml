workflows:
  build-switch-ipa:
    name: Build Switch IPA with nxnative
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      python: 3.12
      vars:
        # Define these in Codemagic UI (App settings > Environment variables)
        # or replace them here with direct download links:
        GAME_DOWNLOAD_URL: ""
        UPDATE_DOWNLOAD_URL: ""
        KEYS_DOWNLOAD_URL: ""
    scripts:
      - name: Install dependencies via Homebrew
        script: |
          echo "Installing toolchain binaries..."
          brew install xcodegen zstd spirv-cross glslang dotnet-sdk

      - name: Install Python requirements and Metal Toolchain
        script: |
          python3 -m pip install --upgrade pip
          pip3 install lz4 capstone fonttools backports.zstd nsz
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Fetch game files and keys
        script: |
          mkdir -p input_files
          mkdir -p keys

          # Download files if environment variables are set
          if [ -n "$GAME_DOWNLOAD_URL" ]; then
            curl -L "$GAME_DOWNLOAD_URL" -o input_files/game.nsp
          fi

          if [ -n "$UPDATE_DOWNLOAD_URL" ]; then
            curl -L "$UPDATE_DOWNLOAD_URL" -o input_files/update.nsp
          fi

          if [ -n "$KEYS_DOWNLOAD_URL" ]; then
            curl -L "$KEYS_DOWNLOAD_URL" -o keys/prod.keys
          fi

      - name: Execute nxnative conversion script
        script: |
          python3 scripts/build_ipa_from_nsp.py input_files -k keys/prod.keys

    artifacts:
      - build/*.ipa
      - "*.ipa"
      - "**/*.ipa"
