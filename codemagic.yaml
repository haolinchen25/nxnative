workflows:
  build-switch-ipa:
    name: Build Switch IPA with nxnative
    max_build_duration: 120
    instance_type: mac_mini_m2
    inputs:
      zip_url:
        description: Direct download link to ZIP containing your NSP/XCI and prod.keys
        type: string
        default: ""
    environment:
      xcode: latest
    scripts:
      - name: Install dependencies via Homebrew
        script: |
          echo "Installing toolchain binaries..."
          brew install xcodegen zstd spirv-cross glslang dotnet-sdk

      - name: Install Python requirements and Metal Toolchain
        script: |
          python3 -m pip install --upgrade pip
          pip3 install lz4 capstone fonttools backports.zstd nsz
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Download and unpack archive
        script: |
          mkdir -p input_files
          mkdir -p keys
          mkdir -p temp_zip

          ZIP_URL="${{ inputs.zip_url }}"

          if [ -z "$ZIP_URL" ]; then
            echo "Error: No ZIP URL provided."
            exit 1
          fi

          echo "Downloading archive..."
          curl -L "$ZIP_URL" -o temp_zip/package.zip

          echo "Extracting files..."
          unzip temp_zip/package.zip -d temp_zip/extracted

          # Automatically find and sort keys and game files
          find temp_zip/extracted -name "*.keys" -exec cp {} keys/prod.keys \;
          find temp_zip/extracted -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" \) -exec cp {} input_files/ \;

          echo "Extracted files ready for conversion:"
          ls -lh keys/
          ls -lh input_files/

      - name: Execute nxnative conversion script
        script: |
          python3 scripts/build_ipa_from_nsp.py input_files -k keys/prod.keys

    artifacts:
      - build/*.ipa
      - "*.ipa"
      - "**/*.ipa"
