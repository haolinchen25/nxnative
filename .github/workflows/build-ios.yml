name: Build Switch IPA

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct download URL for game ZIP archive'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Protect sensitive inputs
        env:
          INPUT_URL: ${{ github.event.inputs.zip_url }}
        run: |
          # Tells GitHub Actions runner to redact this string in all logs
          echo "::add-mask::$INPUT_URL"
          echo "DOWNLOAD_URL=$INPUT_URL" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang dotnet-sdk

      - name: Set up Python and toolchains
        run: |
          python3 -m pip install --upgrade pip
          pip3 install lz4 capstone fonttools backports.zstd nsz
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Download and unpack game files
        run: |
          mkdir -p input_files keys temp_zip

          # $DOWNLOAD_URL is masked as *** in the console
          curl -L "$DOWNLOAD_URL" -o temp_zip/package.zip
          unzip temp_zip/package.zip -d temp_zip/extracted

          find temp_zip/extracted -name "*.keys" -exec cp {} keys/prod.keys \;
          find temp_zip/extracted -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" \) -exec cp {} input_files/ \;

      - name: Execute nxnative conversion script
        run: |
          python3 scripts/build_ipa_from_nsp.py input_files -k keys/prod.keys

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-game-ipa
          path: "**/*.ipa"
          retention-days: 1
